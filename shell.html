<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"/>
    <title>Rubik's Cube</title>
    <style>
      body { margin: 0; padding: 0; background-color: #0a0a0a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      canvas.emscripten { border: 0px none; background-color: #0a0a0a; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 40px) 20px; box-sizing: border-box; }
      .scramble-btn { pointer-events: auto; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 16px 32px; border-radius: 30px; font-weight: 800; font-size: 14px; letter-spacing: 1px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; align-self: center; margin-bottom: 20px; transition: all 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-transform: uppercase; }
      .scramble-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.95); }
      .header { pointer-events: auto; text-align: center; color: white; margin-top: 10px; opacity: 0.6; font-size: 12px; letter-spacing: 4px; font-weight: bold; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="ui-layer">
        <div class="header">3D PUZZLE ENGINE</div>
        <button class="scramble-btn" onclick="Module.ccall('scramble_cube', 'v', [])">Scramble</button>
    </div>
    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        print: function(text) { console.log(text); },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {},
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
