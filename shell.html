<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"/>
    <title>3D Rubik's Cube</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0d;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #0a0a0d;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 28px) 20px;
      }
      .top-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      .title {
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 4px;
        opacity: 0.95;
        text-transform: uppercase;
      }
      .subtitle {
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        letter-spacing: 0.6px;
        text-align: center;
      }

      .bottom-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }

      .action-bar {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .action-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: white;
        padding: 13px 28px;
        border-radius: 28px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        text-transform: uppercase;
      }
      .action-btn.primary {
        background: #ffffff;
        color: #0a0a0d;
        border-color: #ffffff;
      }
      .action-btn:active {
        transform: scale(0.94);
        opacity: 0.85;
      }

      .zoom-group {
        display: flex;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        overflow: hidden;
      }
      .zoom-btn {
        background: transparent;
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .zoom-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .zoom-btn:active {
        background: rgba(255, 255, 255, 0.22);
        transform: scale(0.92);
      }
      .zoom-divider {
        width: 1px;
        background: rgba(255, 255, 255, 0.14);
        height: 24px;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <div id="ui-layer">
      <div class="top-bar">
        <div class="title">3D Rubik's Cube</div>
        <div class="subtitle">Drag cube to turn layers • Drag background to rotate • Scroll / Pinch / Buttons to zoom</div>
      </div>

      <div class="bottom-controls">
        <div class="action-bar">
          <button class="action-btn primary" onclick="triggerScramble(event)">Scramble</button>
          <button class="action-btn" onclick="triggerReset(event)">Reset</button>
        </div>
        <div class="zoom-group">
          <button class="zoom-btn" onclick="handleZoomClick(event, 0.9)" title="Zoom In" aria-label="Zoom In">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="zoom-divider"></div>
          <button class="zoom-btn" onclick="handleZoomClick(event, -0.9)" title="Zoom Out" aria-label="Zoom Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script type='text/javascript'>
      function triggerScramble(e) {
        if (e) e.stopPropagation();
        if (typeof Module._scramble_cube === 'function') {
          Module._scramble_cube();
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('scramble_cube', 'v', []);
        }
      }

      function triggerReset(e) {
        if (e) e.stopPropagation();
        if (typeof Module._reset_cube === 'function') {
          Module._reset_cube();
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('reset_cube', 'v', []);
        }
      }

      function sendZoom(delta) {
        if (typeof Module._zoom_cube === 'function') {
          Module._zoom_cube(delta);
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('zoom_cube', 'v', ['number'], [delta]);
        }
      }

      function handleZoomClick(e, delta) {
        if (e) e.stopPropagation();
        sendZoom(delta);
      }

      // Wheel Zoom Listener (for desktop mouse wheel / trackpad scroll)
      window.addEventListener('wheel', function(e) {
        var delta = -e.deltaY * 0.003;
        sendZoom(delta);
      }, { passive: true });

      var Module = {
        webglContextAttributes: {
          depth: true,
          alpha: false,
          antialias: true,
          preserveDrawingBuffer: false,
          failIfMajorPerformanceCaveat: false
        },
        preRun: [],
        postRun: [],
        print: function(text) { console.log(text); },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {},
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
