<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"/>
    <title>3D Rubik's Cube</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0d;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #0a0a0d;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 28px) 20px;
      }
      .top-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      .title {
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 4px;
        opacity: 0.95;
        text-transform: uppercase;
      }
      .subtitle {
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        letter-spacing: 0.6px;
        text-align: center;
      }

      .bottom-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: auto;
        margin-bottom: 8px;
      }

      .action-bar {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .action-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: white;
        padding: 13px 28px;
        border-radius: 28px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        text-transform: uppercase;
      }
      .action-btn.primary {
        background: #ffffff;
        color: #0a0a0d;
        border-color: #ffffff;
      }
      .action-btn:active {
        transform: scale(0.94);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <div id="ui-layer">
      <div class="top-bar">
        <div class="title">3D Rubik's Cube</div>
        <div class="subtitle">Drag cube to turn layers • Drag background to rotate • Pinch / Scroll to zoom</div>
      </div>

      <div class="bottom-controls">
        <div class="action-bar">
          <button class="action-btn primary" onclick="triggerScramble(event)">Scramble</button>
          <button class="action-btn" onclick="triggerReset(event)">Reset</button>
        </div>
      </div>
    </div>

    <script type='text/javascript'>
      function triggerScramble(e) {
        if (e) e.stopPropagation();
        if (typeof Module._scramble_cube === 'function') {
          Module._scramble_cube();
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('scramble_cube', 'v', []);
        }
      }

      function triggerReset(e) {
        if (e) e.stopPropagation();
        if (typeof Module._reset_cube === 'function') {
          Module._reset_cube();
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('reset_cube', 'v', []);
        }
      }

      function sendZoom(delta) {
        if (typeof Module._zoom_cube === 'function') {
          Module._zoom_cube(delta);
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('zoom_cube', 'v', ['number'], [delta]);
        }
      }

      var canvas = document.getElementById('canvas');
      var activeTouches = new Map();
      var isPinchZooming = false;
      var lastPinchDistance = 0;

      function getCanvasBounds() {
        var rect = canvas.getBoundingClientRect();
        return {
          width: canvas.width || rect.width || window.innerWidth,
          height: canvas.height || rect.height || window.innerHeight,
          left: rect.left,
          top: rect.top,
          cssW: rect.width || window.innerWidth,
          cssH: rect.height || window.innerHeight
        };
      }

      function sendPointerDown(clientX, clientY) {
        var b = getCanvasBounds();
        var px = ((clientX - b.left) / b.cssW) * b.width;
        var py = ((clientY - b.top) / b.cssH) * b.height;
        if (typeof Module._on_pointer_down === 'function') {
          Module._on_pointer_down(px, py, b.width, b.height);
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('on_pointer_down', 'v', ['number', 'number', 'number', 'number'], [px, py, b.width, b.height]);
        }
      }

      function sendPointerMove(clientX, clientY) {
        var b = getCanvasBounds();
        var px = ((clientX - b.left) / b.cssW) * b.width;
        var py = ((clientY - b.top) / b.cssH) * b.height;
        if (typeof Module._on_pointer_move === 'function') {
          Module._on_pointer_move(px, py, b.width, b.height);
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('on_pointer_move', 'v', ['number', 'number', 'number', 'number'], [px, py, b.width, b.height]);
        }
      }

      function sendPointerUp() {
        if (typeof Module._on_pointer_up === 'function') {
          Module._on_pointer_up();
        } else if (typeof Module.ccall === 'function') {
          Module.ccall('on_pointer_up', 'v', []);
        }
      }

      // Pointer event listeners on canvas for mouse & touch
      canvas.addEventListener('pointerdown', function(e) {
        if (e.target !== canvas) return;
        try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activeTouches.size === 1 && !isPinchZooming) {
          sendPointerDown(e.clientX, e.clientY);
        } else if (activeTouches.size >= 2) {
          isPinchZooming = true;
          sendPointerUp();
          var pts = Array.from(activeTouches.values());
          lastPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
      });

      canvas.addEventListener('pointermove', function(e) {
        if (!activeTouches.has(e.pointerId)) return;
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (isPinchZooming && activeTouches.size >= 2) {
          var pts = Array.from(activeTouches.values());
          var curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (lastPinchDistance > 1.0) {
            var delta = (curDist - lastPinchDistance) * 0.02;
            sendZoom(delta);
          }
          lastPinchDistance = curDist;
        } else if (!isPinchZooming && activeTouches.size === 1) {
          sendPointerMove(e.clientX, e.clientY);
        }
      });

      function onPointerEnd(e) {
        if (activeTouches.has(e.pointerId)) {
          try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
          activeTouches.delete(e.pointerId);
        }
        if (activeTouches.size === 0) {
          isPinchZooming = false;
          lastPinchDistance = 0;
          sendPointerUp();
        }
      }

      canvas.addEventListener('pointerup', onPointerEnd);
      canvas.addEventListener('pointercancel', onPointerEnd);

      // Wheel Zoom Listener (for desktop mouse wheel / trackpad scroll)
      window.addEventListener('wheel', function(e) {
        var delta = -e.deltaY * 0.003;
        sendZoom(delta);
      }, { passive: true });

      var Module = {
        webglContextAttributes: {
          depth: true,
          alpha: false,
          antialias: true,
          preserveDrawingBuffer: false,
          failIfMajorPerformanceCaveat: false
        },
        preRun: [],
        postRun: [],
        print: function(text) { console.log(text); },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {},
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
